name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -race ./...

      - name: go test
        if: matrix.os != 'ubuntu-latest'
        # Integration tests create real Git repositories and need git in PATH,
        # which all GitHub-hosted runners provide.
        run: go test -count=1 ./...

      - name: demo
        run: go run ./examples/demo
